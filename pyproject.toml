[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opensim-models"
version = "6"
description = "Composable OpenSim models, including an ANSUR II anthropometric user"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "vtk>=9.2",
    "sv-ttk>=2.6",
    "Pillow>=9",
    "imageio>=2.30",
    "imageio-ffmpeg>=0.4",
]

[project.optional-dependencies]
opensim = ["opensim"]
cad = ["pythonocc-core"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opensim_models = ["models/user/assets/*", "models/user/assets/meshes/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
stubPath = "typings"
